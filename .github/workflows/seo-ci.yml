name: SEO quality checks

on:
  pull_request:
    paths:
      - '_config.yml'
      - '_includes/**'
      - 'index.html'
      - 'motus.html'
      - 'motus2/**'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'llms.txt'
      - 'seo/**'
      - 'scripts/check-seo.mjs'
      - 'scripts/check-lighthouse-budget.mjs'
      - 'scripts/generate-sitemap.mjs'
      - '.github/workflows/seo-ci.yml'
  push:
    branches: [master]
    paths:
      - '_config.yml'
      - '_includes/**'
      - 'index.html'
      - 'motus.html'
      - 'motus2/**'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'llms.txt'
      - 'seo/**'
      - 'scripts/check-seo.mjs'
      - 'scripts/check-lighthouse-budget.mjs'
      - 'scripts/generate-sitemap.mjs'
      - '.github/workflows/seo-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out SEO sources without media blobs
        env:
          TARGET_SHA: ${{ github.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git sparse-checkout init --no-cone
          git sparse-checkout set --no-cone \
            '/_config.yml' \
            '/_includes/**' \
            '/index.html' \
            '/motus.html' \
            '/motus2/index.html' \
            '/motus2/demos/index.html' \
            '/motus2/zh/index.html' \
            '/robots.txt' \
            '/sitemap.xml' \
            '/llms.txt' \
            '/seo/**' \
            '/scripts/check-seo.mjs' \
            '/scripts/check-lighthouse-budget.mjs' \
            '/scripts/generate-sitemap.mjs'
          git fetch --depth=1 --filter=blob:none origin "$TARGET_SHA"
          git checkout --detach FETCH_HEAD

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify generated sitemap
        run: node scripts/generate-sitemap.mjs --check

      - name: Audit technical and scholarly SEO
        run: node scripts/check-seo.mjs

      - name: Validate the web-quality budget checker
        run: node --check scripts/check-lighthouse-budget.mjs
