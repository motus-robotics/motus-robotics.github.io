name: Production SEO monitor

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-health:
    runs-on: ubuntu-latest
    steps:
      - name: Check out monitor without media blobs
        env:
          TARGET_SHA: ${{ github.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git sparse-checkout init --no-cone
          git sparse-checkout set --no-cone '/scripts/check-live-seo.mjs'
          git fetch --depth=1 --filter=blob:none origin "$TARGET_SHA"
          git checkout --detach FETCH_HEAD

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check live canonical pages and discovery files
        run: node scripts/check-live-seo.mjs
